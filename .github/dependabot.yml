version: 2

updates:
  # The GitHub Actions in these workflows are pinned to mutable tags (@v4, @v2), and
  # publish.yml holds the npm Trusted Publishing identity — keeping the actions current
  # is the cheap half of that; grouped so one PR covers all three workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  # One PR for everything. The first run of this file grouped development dependencies
  # only, which left every runtime dependency to its own PR — seven at once on a repo
  # with two source dependencies. Reviewing one combined update against one CI run is
  # the whole point here.
  - package-ecosystem: npm
    directories:
      - /
      - /packages/unplugin
      - /packages/bun
      - /examples/*
    schedule:
      interval: monthly
    groups:
      all-dependencies:
        patterns: ['*']
    ignore:
      # Both packages build through unbuild, which declares a peer of
      # typescript ^5.9.2 — so a TypeScript 7 bump breaks the build, and inside a
      # single group it takes every other update down with it (that is what happened
      # to the first grouped PR). Lift this once unbuild supports 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
